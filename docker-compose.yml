services:
  postgres:
    image: postgres:16-alpine
    container_name: lansub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lansub
      POSTGRES_PASSWORD: lansub
      POSTGRES_DB: lansub
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lansub -d lansub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lansub-network

  redis:
    image: redis:7-alpine
    container_name: lansub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lansub-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lansub-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1884}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - lansub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lansub-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8501}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://lansub:lansub@postgres:5432/lansub
      REDIS_URL: redis://redis:6379/0
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      JWT_SECRET: lansub-stream-secure-dev-secret-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - lansub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8501/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8501/ws}
    container_name: lansub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8500}:3000"
    depends_on:
      - backend
    networks:
      - lansub-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local

networks:
  lansub-network:
    driver: bridge
